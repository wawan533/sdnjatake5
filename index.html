<!DOCTYPE html>
<html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin Guru - SDN Jatake 5</title>
<style>body{font-family:Arial;padding:20px;background:#f1f5f9}.card{background:#fff;padding:20px;border-radius:12px;max-width:600px;margin:auto}input{width:100%;padding:10px;margin:6px 0 12px;border:1px solid #ccc;border-radius:8px}button{padding:10px 16px;border:0;border-radius:8px;font-weight:bold;cursor:pointer}.btn-blue{background:#1E40AF;color:#fff}.btn-red{background:#DC2626;color:#fff}.btn-green{background:#16a34a;color:#fff}.item{border:1px solid #eee;padding:10px;border-radius:8px;margin:8px 0;display:flex;justify-content:space-between;background:#f9fafb}</style>
</head><body><div class="card">
<h2>🔐 Admin Guru - SDN Jatake 5</h2>
<input id="nama" placeholder="Nama Lengkap + Gelar">
<input id="jabatan" placeholder="Jabatan, contoh: Wali Kelas 2B">
<input id="nip" placeholder="NIP (opsional)">
<button class="btn-blue" onclick="tambah()">➕ Tambah Guru</button>
<button class="btn-green" onclick="exportKode()">📋 Copy Kode Permanen</button>
<hr><div id="list"></div>
<a href="index.html">← Kembali ke Web</a></div>
<script>
let guru=JSON.parse(localStorage.getItem('guruSDN5')||'null')||[{nama:"RUKMINI, S.Pd.SD",jabatan:"Kepala Sekolah",nip:"197212041993072001"},{nama:"LINDAWATI, S.PD",jabatan:"Wali Kelas VI C",nip:"198505122010012003"},{nama:"Hernawan",jabatan:"Operator Dapodik",nip:"-"}];
function render(){document.getElementById('list').innerHTML=guru.map((g,i)=>`<div class="item"><div><b>${g.nama}</b><br><small>${g.jabatan} | ${g.nip}</small></div><button class="btn-red" onclick="hapus(${i})">Hapus</button></div>`).join('');localStorage.setItem('guruSDN5',JSON.stringify(guru))}
function tambah(){const n=document.getElementById('nama').value.trim(),j=document.getElementById('jabatan').value.trim(),nip=document.getElementById('nip').value.trim();if(!n||!j){alert('Nama dan Jabatan wajib');return}guru.push({nama:n,jabatan:j,nip:nip||'-'});document.getElementById('nama').value='';document.getElementById('jabatan').value='';document.getElementById('nip').value='';render()}
function hapus(i){if(confirm('Hapus?')){guru.splice(i,1);render()}}
function exportKode(){navigator.clipboard.writeText(JSON.stringify(guru,null,2)).then(()=>alert('✅ Kode di-copy! Paste di index.html bagian DATA_GURU_DEFAULT'))}
render();
</script></body></html>
